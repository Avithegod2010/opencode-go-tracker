name: Security

# Runs the same two checks the audit used, so the findings cannot quietly come back.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks 8.30.1
        # Pinned by release URL, not a movable action tag.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git . --log-opts="--all" --redact --no-banner --exit-code 1


  python-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: pip-audit
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --quiet pip-audit
            pip-audit -r requirements.txt
          else
            echo "No requirements.txt — skipping."
          fi
